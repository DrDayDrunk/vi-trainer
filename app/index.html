<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vi Trainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Vietnamese Sentence Trainer</title>
</head>
<body>
<main>
  <h1>Vietnamese Trainer</h1>

  <section class="card" aria-labelledby="h-today">
    <h2 id="h-today">Today</h2>
    <p id="status" class="muted">Loading...</p>
    <dl class="counts">
      <div><dt>New</dt><dd id="c-new">0</dd></div>
      <div><dt>Learning</dt><dd id="c-learning">0</dd></div>
      <div><dt>Due</dt><dd id="c-review">0</dd></div>
    </dl>
  </section>

  <section id="preview" class="card" aria-labelledby="h-preview" hidden>
    <h2 id="h-preview">Sentence <span id="num"></span></h2>
    <p id="vi" lang="vi"></p>
    <p id="en" lang="en" class="muted"></p>
    <div class="row">
      <button id="pe" class="quiet"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>English</button>
      <button id="pv" class="quiet"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>Vietnamese</button>
    </div>
    <div class="row">
      <button id="prev" class="quiet" aria-label="Previous sentence"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="next" class="quiet" aria-label="Next sentence"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <section class="actions">
    <button id="study" class="main" disabled>Start studying (next stage)</button>
    <button id="pick" class="quiet">Import sentences</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <p id="msg" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="vendor/ts-fsrs.umd.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
