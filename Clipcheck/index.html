<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clip check">
<title>Clip check</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--mut:#666;--line:#ccc;--btn:#e8e8ed}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f2;--mut:#999;--line:#444;--btn:#2c2c2e}}
body{margin:0;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif}
h1{font-size:18px;margin:0 0 8px}
button,select,input[type=file]{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:10px;min-height:44px;padding:0 14px;margin:0 6px 8px 0}
#vi{font-size:30px;line-height:1.3;margin:10px 0 2px}
#en{color:var(--mut);margin:0 0 10px}
#log{white-space:pre-wrap;font:12px/1.35 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;height:34vh;overflow:auto}
</style>
</head>
<body>
<h1>Clip check</h1>
<input type="file" id="file" accept=".json,application/json">
<div id="card" hidden>
  <p id="vi"></p><p id="en"></p>
  <button id="prev">&larr;</button><button id="next">&rarr;</button>
  <button id="pe">Play English</button><button id="pv">Play Vietnamese</button><button id="stop">Stop</button><br>
  <select id="mode"><option value="shared">One shared player</option><option value="fresh">New player per clip</option></select>
  <button id="run">Run test: sentences 1-10, English then Vietnamese</button>
</div>
<button id="copy">Copy log</button>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id);
const t0 = Date.now();
const log = m => { $('log').textContent += ((Date.now() - t0) / 1000).toFixed(1).padStart(6) + 's ' + m + '\n'; $('log').scrollTop = 1e9; };

// The bundle is kept in IndexedDB so it survives the page being reloaded after an app switch.
const db = () => new Promise((ok, no) => { const r = indexedDB.open('clipcheck', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const kv = async (mode, fn) => { const d = await db(); return new Promise((ok, no) => { const t = d.transaction('kv', mode), q = fn(t.objectStore('kv')); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }); };

let S = [], type = 'audio/mp4', i = 0, stopped = false;
const A = new Audio(), urls = {};

function useBundle(text) {
  const b = JSON.parse(text);
  const ok = b && b.format === 'vi-trainer-bundle' && Array.isArray(b.sentences) && b.sentences.length === b.count &&
    b.sentences.every(s => s && typeof s.en_audio === 'string' && typeof s.vi_audio === 'string' && s.vi_text && s.en_text);
  if (!ok) throw new Error('This is not a valid pack file.');
  S = b.sentences; type = b.audio_type || 'audio/mp4'; i = 0;
  $('card').hidden = false; show(); log('Pack loaded: ' + S.length + ' sentences, ' + S[0].number + '-' + S[S.length - 1].number);
}
const show = () => { $('vi').textContent = S[i].number + '. ' + S[i].vi_text; $('en').textContent = S[i].en_text; };
const url = (s, k) => urls[s.number + k] ||= URL.createObjectURL(new Blob([Uint8Array.from(atob(s[k + '_audio']), c => c.charCodeAt(0))], { type }));

// Plays one clip; resolves true only if it fired "ended" after roughly its full length. Gives up after 15 s.
function play(s, k) {
  const el = $('mode').value === 'shared' ? A : new Audio(), label = '#' + s.number + ' ' + k;
  return new Promise(res => {
    const t = performance.now();
    const end = (good, msg) => { clearTimeout(to); el.onended = el.onerror = null; log((good ? 'ok   ' : 'FAIL ') + label + ' ' + msg); res(good); };
    const to = setTimeout(() => end(false, 'no end after 15 s (stuck at ' + el.currentTime.toFixed(1) + ' s of ' + el.duration + ')'), 15000);
    el.onended = () => { const sec = (performance.now() - t) / 1000; end(sec >= 0.8 * el.duration, 'played ' + sec.toFixed(1) + ' s of ' + el.duration.toFixed(1) + ' s'); };
    el.onerror = () => end(false, 'audio error code ' + (el.error && el.error.code));
    el.src = url(s, k);
    const p = el.play(); if (p) p.catch(e => end(false, 'play() refused: ' + e.name));
  });
}

async function run() {
  stopped = false; let pass = 0, total = 0;
  log('--- test start: ' + $('mode').selectedOptions[0].text);
  for (const s of S.slice(0, 10)) for (const k of ['en', 'vi']) {
    if (stopped) { log('--- stopped'); return; }
    total++; if (await play(s, k)) pass++;
    await new Promise(r => setTimeout(r, 500));   // next clip starts from a timer, not a tap: tests auto-play
  }
  log('RESULT ' + pass + ' of ' + total + ' clips played to the end');
}

$('file').onchange = async e => {
  try { const text = await e.target.files[0].text(); useBundle(text); await kv('readwrite', s => s.put(text, 'bundle')); }
  catch (err) { log('Could not load: ' + err.message); }
};
$('prev').onclick = () => { i = (i + S.length - 1) % S.length; show(); };
$('next').onclick = () => { i = (i + 1) % S.length; show(); };
$('pe').onclick = () => play(S[i], 'en');
$('pv').onclick = () => play(S[i], 'vi');
$('stop').onclick = () => { stopped = true; A.pause(); };
$('run').onclick = run;
$('copy').onclick = () => navigator.clipboard.writeText($('log').textContent).then(() => log('Log copied'), () => log('Copy refused; select the text instead'));
document.addEventListener('visibilitychange', () => log('app is ' + document.visibilityState));

log('Page started. Home Screen app: ' + (navigator.standalone === true ? 'YES' : 'NO'));
log(navigator.userAgent.replace(/^Mozilla\/5.0 /, ''));
kv('readonly', s => s.get('bundle')).then(t => { if (t) { useBundle(t); log('(loaded from saved copy)'); } }).catch(e => log('Saved copy not usable: ' + e.message));
</script>
</body>
</html>
