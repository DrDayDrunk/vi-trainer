<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Audio test">
<link rel="manifest" href="manifest.webmanifest">
<title>Lock-screen audio test</title>
<style>
  :root { color-scheme: light dark; font: 17px/1.4 system-ui, sans-serif; }
  body { max-width: 32rem; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  button { display: block; width: 100%; min-height: 48px; margin: 12px 0; font: inherit; border-radius: 12px; }
  audio { width: 100%; margin: 12px 0; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<h1>Lock-screen audio test</h1>
<p id="mode"></p>
<p>Press Play, lock the phone at once, and wait about 3 minutes. The pitch rises each minute (low, middle, high). The test passed if you hear three falling beeps at the end.</p>
<button id="play">Play 3-minute test</button>
<audio id="a" controls></audio>
<button id="save">Save as a file (for way c)</button>
<h2>Log</h2>
<pre id="log"></pre>
<script>
// BEGIN pure
const R = 16000; // sample rate; WAV chosen so no encoder is needed
const tone = (f, s) => {
  const n = Math.round(s * R), a = new Float32Array(n);
  for (let i = 0; i < n; i++) a[i] = 0.5 * Math.sin(2 * Math.PI * f * i / R) * Math.min(1, i / 160, (n - i) / 160);
  return a;
};
const gap = s => new Float32Array(Math.round(s * R));
function build() {
  const p = [];
  for (let u = 0; u < 15; u++) { // 15 units x 12 s = 180 s, like English, Vietnamese, Vietnamese
    const f = 440 * (1 + 0.5 * Math.floor(u / 5)); // 440, 660, 880 Hz by minute
    p.push(tone(f, 1), gap(2.5), tone(f * 1.5, 1.5), gap(3), tone(f * 1.5, 1.5), gap(2.5));
  }
  p.push(tone(880, 0.4), tone(660, 0.4), tone(440, 0.4)); // end marker
  const all = new Float32Array(p.reduce((n, x) => n + x.length, 0));
  let o = 0;
  for (const x of p) { all.set(x, o); o += x.length; }
  return all;
}
function wav(x) {
  const b = new DataView(new ArrayBuffer(44 + x.length * 2));
  const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + x.length * 2, true); w(8, "WAVEfmt ");
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, R, true); b.setUint32(28, R * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
  w(36, "data"); b.setUint32(40, x.length * 2, true);
  x.forEach((v, i) => b.setInt16(44 + i * 2, v * 32767, true));
  return new Blob([b], { type: "audio/wav" });
}
// END pure

const $ = id => document.getElementById(id), a = $("a");
const log = m => { $("log").textContent += new Date().toLocaleTimeString() + "  " + m + "\n"; };
const at = () => " at " + Math.round(a.currentTime) + " s";
let blob;
const load = () => {
  if (blob) return;
  blob = wav(build());
  a.src = URL.createObjectURL(blob);
  log("built " + (blob.size / 1e6).toFixed(1) + " MB");
};

const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
$("mode").textContent = "Running as: " + (standalone ? "HOME-SCREEN APP (way b)" : "SAFARI TAB (way a)");

$("play").onclick = () => {
  if (navigator.audioSession) navigator.audioSession.type = "playback";
  load();
  a.play().catch(e => log("play refused: " + e.name));
};
$("save").onclick = async () => {
  load();
  try { await navigator.share({ files: [new File([blob], "lockscreen-test.wav", { type: "audio/wav" })] }); }
  catch (e) { log("share: " + e.name); }
};

["play", "pause", "ended", "error", "waiting", "stalled"].forEach(e => a.addEventListener(e, () => log(e + at())));
document.addEventListener("visibilitychange", () => log("page " + document.visibilityState + at()));

if ("mediaSession" in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({ title: "Lock-screen test", artist: "Audio test" });
  navigator.mediaSession.setActionHandler("play", () => a.play());
  navigator.mediaSession.setActionHandler("pause", () => a.pause());
}
</script>
</body>
</html>
